<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>หลังบ้าน · อสังหาฯ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  header{padding:22px 0 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  h1{font-size:22px}
  .lock{font-size:12px;font-weight:600;color:var(--owner);background:var(--owner-soft);padding:4px 10px;border-radius:999px;white-space:nowrap;border:0;font-family:inherit;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
  .stat b{display:block;font-size:22px;line-height:1.2}
  .stat span{font-size:11px;color:var(--muted);white-space:nowrap}
  .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
  .item.has-thumb{grid-template-columns:auto 1fr auto}
  .item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--bg)}
  .code{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
  .ititle{font-weight:600;font-size:16px;margin:0}
  .meta{font-size:13px;color:var(--muted);margin:0}
  .owner-line{font-size:13px;color:var(--owner);margin:2px 0 0}
  .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
  .right .price{font-size:16px}
  .web{font-size:11px;color:var(--muted)}
  .fab{position:fixed;right:18px;bottom:22px;z-index:10;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font:inherit;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
  form .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-top:10px}
  input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
  textarea{min-height:68px;resize:vertical}
  .check{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
  .check input{width:auto}
  .err{color:var(--danger);font-size:13px;margin-top:10px;min-height:1em}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  .gal .m{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:block}
  .gal img{width:100%;height:100%;object-fit:cover;display:block}
  .gal .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:13px}
  .gal .tag{position:absolute;left:4px;bottom:4px;font-size:10px;background:rgba(0,0,0,.6);color:#fff;padding:1px 6px;border-radius:6px}
  .gal .busy{display:grid;place-items:center;font-size:12px;color:var(--muted);text-align:center;padding:4px}
  .upl{display:block;text-align:center;padding:12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--accent);font-weight:600;cursor:pointer;margin-top:8px}
  .upl input{display:none}
  .login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="login" id="login">
    <h1>🔒 หลังบ้าน</h1>
    <p class="sub">ใส่รหัสหลังบ้าน (ได้จากตอนรัน setup ใน Apps Script)</p>
    <form id="loginForm">
      <label>รหัสหลังบ้าน<input id="keyInput" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" id="remember" checked> จำไว้ในเครื่องนี้</label>
      <p class="err" id="loginErr"></p>
      <button class="btn primary" type="submit" style="width:100%">เข้าสู่ระบบ</button>
    </form>
  </div>

  <div id="main" hidden>
    <header>
      <div>
        <h1>หลังบ้าน · อสังหาฯ</h1>
        <p class="sub">ข้อมูลทรัพย์ + ข้อมูลเจ้าของ ใช้เองเท่านั้น</p>
      </div>
      <button class="lock" id="logoutBtn" type="button" title="ออกจากระบบ">🔒 ออกจากระบบ</button>
    </header>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="btn" type="button" id="exportBtn">⬇︎ ส่งออกไฟล์</button>
      <a class="btn" id="siteLink" href="./" target="_blank" rel="noopener">🌐 ดูเว็บลูกค้า</a>
    </div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="ค้นหา รหัส ชื่อ ทำเล หรือชื่อ/เบอร์เจ้าของ" aria-label="ค้นหา">
      <div class="chips" id="statusChips" role="group" aria-label="สถานะ"></div>
    </div>
    <div class="list" id="list"><p class="msg">กำลังโหลดข้อมูล…</p></div>
  </div>
</div>

<button class="fab" id="addBtn" type="button" hidden>+ เพิ่มทรัพย์</button>
<div class="overlay" id="overlay" aria-hidden="true"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="media.js"></script>
<script>
const C = window.APP_CONFIG, {esc, fmt, range, safeUrl} = Util;
const $ = id => document.getElementById(id);
const TYPES = ["คอนโด","อพาร์ทเม้นท์","บ้าน","ทาวน์โฮม","ที่ดิน","อาคารพาณิชย์/ตึก"];
const DEALS = ["ให้เช่า","ขาย","เช่าหรือขาย"];
const STATUSES = ["พร้อมปล่อย","ติดจอง","มีผู้เช่าแล้ว","ขายแล้ว","เตรียมข้อมูล"];
const RIGHTS = ["ของเราเอง","เช่าช่วงมาบริหาร","รับฝากขาย/เช่า"];
const STATUS_CLASS = {"พร้อมปล่อย":"s-ready","ติดจอง":"s-hold","มีผู้เช่าแล้ว":"s-done","ขายแล้ว":"s-done","เตรียมข้อมูล":"s-prep"};
const MAX_MB = 25;

let KEY = "", items = [], filter = "ทั้งหมด", q = "", formState = null;
const store = { get(){ try{ return localStorage.getItem("adminKey") || ""; }catch(e){ return ""; } },
                set(v){ try{ v ? localStorage.setItem("adminKey", v) : localStorage.removeItem("adminKey"); }catch(e){} } };

/* ---------- API ---------- */
async function apiGet(){
  const r = await fetch(`${C.API_URL}${C.API_URL.includes("?")?"&":"?"}action=admin&key=${encodeURIComponent(KEY)}&t=${Date.now()}`);
  const d = await r.json(); if(!d.ok) throw new Error(d.error); return d;
}
async function apiPost(action, payload){
  // ส่งเป็น text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight (Apps Script ไม่รองรับ)
  const r = await fetch(C.API_URL, { method:"POST", body: JSON.stringify(Object.assign({key:KEY, action}, payload)) });
  const d = await r.json(); if(!d.ok) throw new Error(d.error); return d;
}
async function reload(){
  const d = await apiGet();
  items = (d.items||[]).sort((a,b)=>a.code.localeCompare(b.code));
  render();
}

/* ---------- เข้าสู่ระบบ ---------- */
async function login(key, remember){
  KEY = key;
  try{
    await reload();
    if(remember) store.set(key);
    $("login").hidden = true; $("main").hidden = false; $("addBtn").hidden = false;
    return true;
  }catch(e){
    KEY = "";
    $("loginErr").textContent = e.message==="unauthorized" ? "รหัสไม่ถูกต้อง" : "เชื่อมต่อไม่ได้ — เช็ก API_URL ใน config.js";
    return false;
  }
}
$("loginForm").onsubmit = e=>{ e.preventDefault(); login($("keyInput").value.trim(), $("remember").checked); };
$("logoutBtn").onclick = ()=>{ store.set(""); location.reload(); };
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && KEY && !$("overlay").classList.contains("open")) reload().catch(()=>{}); });

/* ---------- รายการ ---------- */
function priceText(p){
  const out = [];
  if(p.rent) out.push(`<div class="price">฿${range(p.rent,p.rentMax)}<span class="web">/ด.</span></div>`);
  if(p.sale) out.push(`<div class="price sale">฿${range(p.sale,p.saleMax)}</div>`);
  if(!out.length) out.push(`<div class="web">ยังไม่ตั้งราคา</div>`);
  return out.join("");
}
function visible(){
  return items.filter(p=>{
    if(filter!=="ทั้งหมด" && p.status!==filter) return false;
    if(q && ![p.code,p.title,p.location,p.province,p.type,p.ownerName,p.ownerPhone,p.ownerPhone2,p.ownerLine].join(" ").toLowerCase().includes(q)) return false;
    return true;
  });
}
function render(){
  const c = s => items.filter(p=>p.status===s).length;
  $("stats").innerHTML = [["ทั้งหมด",items.length],["พร้อมปล่อย",c("พร้อมปล่อย")],["เตรียมข้อมูล",c("เตรียมข้อมูล")],["บนเว็บลูกค้า",items.filter(p=>p.showOnWeb).length]]
    .map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
  const el = $("statusChips"); el.innerHTML = "";
  ["ทั้งหมด", ...STATUSES].forEach(s=>{
    const b = document.createElement("button"); b.className="chip"; b.type="button"; b.textContent=s;
    b.setAttribute("aria-pressed", String(filter===s)); b.onclick=()=>{ filter=s; render(); }; el.appendChild(b);
  });
  const list = visible();
  if(!items.length){ $("list").innerHTML = `<p class="msg">ยังไม่มีทรัพย์ กด “+ เพิ่มทรัพย์” เพื่อเริ่ม</p>`; return; }
  if(!list.length){ $("list").innerHTML = `<p class="msg">ไม่พบรายการที่ตรงกับที่เลือก</p>`; return; }
  $("list").innerHTML = list.map(p=>{
    const m = (p.media||[])[0];
    return `<button class="item${m?" has-thumb":""}" type="button" data-code="${esc(p.code)}">
      ${m ? `<img class="thumb" src="${Media.thumb(m.id,200)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
      <div>
        <div class="code">${esc(p.code)} · ${esc(p.type)} · ${esc(p.deal)}${p.rights && p.rights!=="ของเราเอง" ? ` · <span style="color:var(--owner)">${esc(p.rights)}</span>` : ""}</div>
        <p class="ititle">${esc(p.title)}</p>
        <p class="meta">📍 ${esc(p.location)} ${esc(p.province)}</p>
        ${p.ownerName||p.ownerPhone ? `<p class="owner-line">👤 ${esc(p.ownerName||"-")}${p.ownerPhone?" · "+esc(p.ownerPhone):""}</p>`:""}
      </div>
      <div class="right">
        <span class="pill ${STATUS_CLASS[p.status]||"s-done"}">${esc(p.status||"-")}</span>
        ${priceText(p)}
        <span class="web">${p.showOnWeb ? "🌐 อยู่บนเว็บลูกค้า" : "ไม่ขึ้นเว็บ"}</span>
      </div>
    </button>`;
  }).join("");
  document.querySelectorAll(".item").forEach(el=>el.onclick=()=>openDetail(el.dataset.code));
}

/* ---------- แผ่นรายละเอียด/ฟอร์ม ---------- */
function openSheet(html){
  $("sheet").innerHTML = `<button class="close" type="button" aria-label="ปิด" id="xBtn">✕</button>` + html;
  $("overlay").classList.add("open"); $("overlay").setAttribute("aria-hidden","false");
  $("xBtn").onclick = closeSheet; $("sheet").scrollTop = 0;
}
function closeSheet(){
  if(formState && formState.added.length) formState.added.forEach(id=>apiPost("deleteFile",{id}).catch(()=>{}));
  formState = null;
  $("overlay").classList.remove("open"); $("overlay").setAttribute("aria-hidden","true");
}
const row = (k,v) => (v===undefined||v===null||v==="") ? "" : `<dt>${k}</dt><dd>${esc(v)}</dd>`;

function openDetail(code){
  const p = items.find(x=>x.code===code); if(!p) return;
  formState = null;
  const media = p.media || [];
  openSheet(`
    ${media.length ? `<div class="slider">${media.map((m,i)=>`<div class="slide">${Media.isVideo(m)
        ? `<iframe src="${Media.player(m.id)}" allow="autoplay; fullscreen" allowfullscreen loading="lazy" title="วิดีโอ"></iframe>`
        : `<img src="${Media.thumb(m.id,1600)}" alt="" loading="lazy" referrerpolicy="no-referrer">`}${media.length>1?`<span class="n">${i+1}/${media.length}</span>`:""}</div>`).join("")}</div>` : ""}
    <div class="code">${esc(p.code)}</div>
    <h2>${esc(p.title)}</h2>
    <span class="pill ${STATUS_CLASS[p.status]||"s-done"}">${esc(p.status)}</span>
    <h3>ข้อมูลทรัพย์</h3>
    <dl>
      ${row("ประเภท",p.type)}${row("เช่า/ขาย",p.deal)}
      ${row("ราคาเช่า", p.rent ? range(p.rent,p.rentMax)+" บาท/เดือน" : "")}
      ${row("ราคาขาย", p.sale ? range(p.sale,p.saleMax)+" บาท" : "")}
      ${row("ทำเล",[p.location,p.province].filter(Boolean).join(" "))}
      ${row("ขนาด",p.size)}${row("ห้องนอน",p.beds)}${row("ห้องน้ำ",p.baths)}
      ${row("จุดเด่น",p.highlights)}${row("เงื่อนไข",p.terms)}
      ${row("ติดต่อ (ลูกค้า)",p.contact)}${row("ลิงก์ LINE",p.lineUrl)}${row("แผนที่",p.mapUrl)}
      ${row("ขึ้นเว็บลูกค้า", p.showOnWeb ? "ใช่" : "ไม่")}
    </dl>
    <h3 class="own">🔒 ข้อมูลเจ้าของ (ไม่โชว์ลูกค้า)</h3>
    <dl>
      ${row("สิทธิ์ในทรัพย์",p.rights)}${row("ชื่อเจ้าของ",p.ownerName)}
      ${p.ownerPhone ? `<dt>เบอร์โทร</dt><dd><a href="tel:${esc(String(p.ownerPhone).replace(/[^\d+]/g,""))}">${esc(p.ownerPhone)}</a></dd>` : ""}
      ${row("เบอร์สำรอง",p.ownerPhone2)}${row("LINE",p.ownerLine)}${row("อีเมล",p.ownerEmail)}
      ${row("สะดวกติดต่อ",p.ownerPref)}${row("ที่อยู่ติดต่อ",p.ownerAddress)}
      ${row("ค่าคอม",p.commission)}${row("ราคาต่ำสุดที่รับได้",p.ownerMinPrice)}${row("รับฝากถึง",p.listingEnd)}
      ${row("ข้อตกลง",p.ownerDeal)}${row("ต้นทุน/ค่าเช่าที่จ่าย",p.ownerCost)}${row("สัญญา",p.ownerContract)}
    </dl>
    ${p.note ? `<h3>หมายเหตุภายใน</h3><p style="margin:0;font-size:14px">${esc(p.note)}</p>` : ""}
    <h3>ข้อความโพส (ไม่มีข้อมูลเจ้าของ)</h3>
    <pre class="post">${esc(Util.postText(p))}</pre>
    <div class="actions">
      <button class="btn primary full" type="button" id="copyBtn">คัดลอกข้อความโพส</button>
      <button class="btn" type="button" id="editBtn">แก้ไข</button>
      <button class="btn danger" type="button" id="delBtn">ลบ</button>
    </div>
    <p class="web" style="margin-top:12px">อัปเดตล่าสุด ${esc(p.updated||"-")}</p>`);
  $("copyBtn").onclick = async()=> toast(await Util.copy(Util.postText(p)) ? "คัดลอกแล้ว" : "คัดลอกไม่ได้");
  $("editBtn").onclick = ()=>openForm(p);
  $("delBtn").onclick = async()=>{
    const b = $("delBtn");
    if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="กดอีกครั้งเพื่อยืนยันลบ"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="ลบ"; } },4000); return; }
    b.disabled = true; b.textContent = "กำลังลบ…";
    try{ await apiPost("delete",{code:p.code}); closeSheet(); toast("ลบแล้ว"); await reload(); }
    catch(e){ b.disabled=false; b.textContent="ลบ"; toast("ลบไม่สำเร็จ"); }
  };
}

const opt = (list,v) => list.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
const field = (n,l,p,t="text",x="") => `<label>${l}<input name="${n}" type="${t}" value="${esc(p[n]??"")}" ${x}></label>`;
const area = (n,l,p) => `<label>${l}<textarea name="${n}">${esc(p[n]??"")}</textarea></label>`;

function openForm(p){
  const isNew = !p;
  p = p || {status:"เตรียมข้อมูล", deal:"ให้เช่า", type:"คอนโด", rights:"ของเราเอง", showOnWeb:false, media:[]};
  openSheet(`
    <h2>${isNew ? "เพิ่มทรัพย์" : "แก้ไข "+esc(p.code)}</h2>
    <form id="f" novalidate>
      <h3>ข้อมูลทรัพย์</h3>
      <div class="grid2">
        ${field("code","รหัส * (เช่น CD-001)",p,"text",'required autocapitalize="characters"')}
        <label>สถานะ<select name="status">${opt(STATUSES,p.status)}</select></label>
      </div>
      ${field("title","ชื่อประกาศ *",p,"text","required")}
      <div class="grid2">
        <label>ประเภท<select name="type">${opt(TYPES,p.type)}</select></label>
        <label>เช่า/ขาย<select name="deal">${opt(DEALS,p.deal)}</select></label>
        ${field("rent","ค่าเช่า/เดือน (เริ่ม)",p,"number",'inputmode="numeric"')}
        ${field("rentMax","ค่าเช่าถึง (ถ้ามีช่วง)",p,"number",'inputmode="numeric"')}
        ${field("sale","ราคาขาย (เริ่ม)",p,"number",'inputmode="numeric"')}
        ${field("saleMax","ราคาขายถึง (ถ้ามีช่วง)",p,"number",'inputmode="numeric"')}
        ${field("location","ทำเล",p)}
        ${field("province","จังหวัด",p)}
        ${field("size","ขนาด (ตร.ม./ตร.ว.)",p)}
        ${field("beds","ห้องนอน",p)}
        ${field("baths","ห้องน้ำ",p)}
        ${field("contact","ติดต่อ (ที่ลูกค้าเห็น)",p)}
      </div>
      ${area("highlights","จุดเด่น / สิ่งอำนวยความสะดวก",p)}
      ${area("terms","เงื่อนไขเช่า / มัดจำ",p)}
      ${field("lineUrl","ลิงก์ LINE ของทรัพย์นี้ (เว้นว่าง = ใช้ LINE กลาง)",p,"url")}
      ${field("mapUrl","ลิงก์แผนที่ Google Maps",p,"url")}
      <label class="check"><input type="checkbox" name="showOnWeb" ${p.showOnWeb?"checked":""}> ขึ้นเว็บลูกค้า</label>

      <h3>รูป / วิดีโอ</h3>
      <div class="gal" id="gal"></div>
      <label class="upl">+ เพิ่มรูปหรือวิดีโอ<input type="file" id="uplInput" accept="image/*,video/*" multiple></label>
      <p class="web">รูปแรกคือรูปปก • วิดีโอไม่เกิน ${MAX_MB} MB ต่อไฟล์ (คลิปทัวร์ห้องสั้นๆ)</p>

      <h3 class="own">🔒 ข้อมูลเจ้าของ</h3>
      <label>สิทธิ์ในทรัพย์<select name="rights">${opt(RIGHTS,p.rights)}</select></label>
      <div class="grid2">
        ${field("ownerName","ชื่อเจ้าของ",p)}
        ${field("ownerPhone","เบอร์โทร",p,"tel")}
        ${field("ownerLine","LINE เจ้าของ",p)}
        ${field("ownerCost","ต้นทุน/ค่าเช่าที่จ่าย",p)}
      </div>
      <p class="web" id="ownHint"></p>
      <div id="ownExtra">
        <div class="grid2">
          ${field("ownerPhone2","เบอร์สำรอง",p,"tel")}
          ${field("ownerEmail","อีเมล",p,"email")}
          ${field("ownerPref","ช่องทาง/เวลาที่สะดวกให้ติดต่อ",p)}
          ${field("commission","ค่าคอม (% หรือบาท)",p)}
          ${field("ownerMinPrice","ราคาต่ำสุดที่เจ้าของรับได้",p)}
          ${field("listingEnd","รับฝากถึงวันที่",p,"date")}
        </div>
        ${area("ownerAddress","ที่อยู่ติดต่อเจ้าของ",p)}
      </div>
      ${area("ownerDeal","ข้อตกลงกับเจ้าของ (เงื่อนไขอื่นๆ)",p)}
      ${field("ownerContract","สัญญา (เริ่ม–สิ้นสุด)",p)}
      ${area("note","หมายเหตุภายใน",p)}
      <p class="err" id="err"></p>
      <div class="actions"><button class="btn" type="button" id="cancelBtn">ยกเลิก</button><button class="btn primary" type="submit" id="saveBtn">บันทึก</button></div>
    </form>`);

  // รูป/วิดีโอ
  const st = formState = { media:(p.media||[]).map(m=>({...m})), added:[], removed:[], busy:0 };
  const drawGal = ()=>{
    $("gal").innerHTML = st.media.map((m,i)=>`<div class="m"><img src="${Media.thumb(m.id,300)}" alt="" referrerpolicy="no-referrer">${i===0?'<span class="tag">ปก</span>':Media.isVideo(m)?'<span class="tag">▶ วิดีโอ</span>':""}<button class="x" type="button" data-i="${i}" aria-label="ลบ">✕</button></div>`).join("")
      + Array.from({length:st.busy},()=>`<div class="m busy">กำลังอัปโหลด…</div>`).join("");
    $("gal").querySelectorAll(".x").forEach(b=>b.onclick=()=>{ const [m] = st.media.splice(+b.dataset.i,1); st.removed.push(m.id); drawGal(); });
    $("saveBtn").disabled = st.busy>0;
  };
  drawGal();
  $("uplInput").onchange = async e=>{
    const files = [...e.target.files]; e.target.value = "";
    for(const file of files){
      const isImg = file.type.startsWith("image/"), isVid = file.type.startsWith("video/");
      if(!isImg && !isVid){ $("err").textContent = `${file.name}: รองรับเฉพาะรูปและวิดีโอ`; continue; }
      st.busy++; drawGal();
      try{
        const blob = isImg ? await shrink(file) : file;
        if(blob.size > MAX_MB*1024*1024) throw new Error(`ไฟล์ใหญ่เกิน ${MAX_MB} MB`);
        const mime = isImg ? (blob.type || "image/jpeg") : (["video/mp4","video/webm","video/quicktime"].includes(file.type) ? file.type : "video/mp4");
        const d = await apiPost("upload", { name:file.name, mime, data: await toBase64(blob) });
        if(formState !== st){ apiPost("deleteFile",{id:d.file.id}).catch(()=>{}); return; } // ปิดฟอร์มไปแล้ว
        st.media.push(d.file); st.added.push(d.file.id);
      }catch(err){ $("err").textContent = `${file.name}: ${err.message || "อัปโหลดไม่สำเร็จ"}`; }
      st.busy--; if(formState===st) drawGal();
    }
  };

  // ข้อมูลเจ้าของเพิ่มเติม
  const rightsSel = $("f").elements.rights;
  const syncOwner = ()=>{
    const ours = rightsSel.value==="ของเราเอง";
    const has = ["ownerPhone2","ownerEmail","ownerPref","commission","ownerMinPrice","listingEnd","ownerAddress"].some(k=>p[k]);
    $("ownExtra").hidden = ours && !has;
    $("ownHint").textContent = ours ? "ทรัพย์ของเราเอง — ช่องติดต่อเจ้าของเพิ่มเติมซ่อนไว้" : "ทรัพย์ของคนอื่น — กรอกข้อมูลติดต่อเจ้าของให้ครบ";
  };
  rightsSel.onchange = syncOwner; syncOwner();

  $("cancelBtn").onclick = ()=>{ const c = p.code; closeSheet(); if(!isNew) openDetail(c); };
  $("f").onsubmit = async e=>{
    e.preventDefault();
    const fd = new FormData(e.target), o = {};
    for(const [k,v] of fd.entries()) o[k] = String(v).trim();
    o.code = (o.code||"").toUpperCase().replace(/\s+/g,"-");
    ["rent","rentMax","sale","saleMax"].forEach(k=>o[k] = o[k]==="" ? null : Number(o[k]));
    o.showOnWeb = fd.has("showOnWeb");
    o.media = st.media;
    if(!o.code || !o.title){ $("err").textContent = "ใส่รหัสและชื่อประกาศก่อน"; return; }
    if(o.code!==p.code && items.some(x=>x.code===o.code)){ $("err").textContent = "รหัสนี้มีอยู่แล้ว"; return; }
    $("saveBtn").disabled = true; $("saveBtn").textContent = "กำลังบันทึก…";
    try{
      await apiPost("save", { item:o, oldCode: isNew ? null : p.code });
      st.added = []; // บันทึกแล้ว ไม่ต้องลบทิ้ง
      st.removed.forEach(id=>apiPost("deleteFile",{id}).catch(()=>{}));
      formState = null;
      await reload(); toast("บันทึกแล้ว · ลูกค้าเห็นทันที"); openDetail(o.code);
    }catch(err){
      $("saveBtn").disabled = false; $("saveBtn").textContent = "บันทึก";
      $("err").textContent = "บันทึกไม่สำเร็จ: " + (err.message || "ลองอีกครั้ง");
    }
  };
}

async function shrink(file){
  if(file.type==="image/gif") return file;
  try{
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600/Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const out = await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    return out || file;
  }catch(e){ return file; }
}
const toBase64 = blob => new Promise((ok,bad)=>{ const r = new FileReader(); r.onload = ()=>ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); });

/* ---------- ส่งออกไฟล์ ---------- */
const PUBLIC_COLS = [["code","รหัส"],["title","ชื่อประกาศ"],["type","ประเภท"],["deal","เช่า/ขาย"],["status","สถานะ"],
  ["rent","ค่าเช่า/เดือน (เริ่ม)"],["rentMax","ค่าเช่าถึง"],["sale","ราคาขาย (เริ่ม)"],["saleMax","ราคาขายถึง"],
  ["location","ทำเล"],["province","จังหวัด"],["size","ขนาด"],["beds","ห้องนอน"],["baths","ห้องน้ำ"],
  ["highlights","จุดเด่น"],["terms","เงื่อนไข"],["contact","ติดต่อ"],["mapUrl","ลิงก์แผนที่"]];
const OWNER_COLS = [["showOnWeb","ขึ้นเว็บลูกค้า"],["rights","สิทธิ์ในทรัพย์"],["ownerName","ชื่อเจ้าของ"],["ownerPhone","เบอร์เจ้าของ"],
  ["ownerPhone2","เบอร์สำรอง"],["ownerLine","LINE เจ้าของ"],["ownerEmail","อีเมลเจ้าของ"],["ownerPref","สะดวกติดต่อ"],
  ["ownerAddress","ที่อยู่เจ้าของ"],["commission","ค่าคอม"],["ownerMinPrice","ราคาต่ำสุดที่รับได้"],["listingEnd","รับฝากถึง"],
  ["ownerDeal","ข้อตกลง"],["ownerCost","ต้นทุน/ค่าเช่าที่จ่าย"],["ownerContract","สัญญา"],["note","หมายเหตุภายใน"],["updated","อัปเดตล่าสุด"]];
function tableRows(list, withOwner){
  const cols = withOwner ? PUBLIC_COLS.concat(OWNER_COLS) : PUBLIC_COLS.concat([["__post","ข้อความโพส"]]);
  return [cols.map(c=>c[1]), ...list.map(p=>cols.map(([k])=>{
    if(k==="__post") return Util.postText(p);
    if(k==="showOnWeb") return p.showOnWeb ? "ใช่" : "ไม่";
    return p[k]==null ? "" : p[k];
  }))];
}
const toCSV = rows => "﻿" + rows.map(r=>r.map(v=>{ let s=String(v); if(/^[=+\-@]/.test(s)) s="'"+s; return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(",")).join("\r\n");
function download(name, data, mime){
  const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data],{type:mime}));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=()=>ok(window.XLSX); s.onerror=bad; document.head.appendChild(s); });
}
const today = ()=>new Date().toISOString().slice(0,10);
function openExport(){
  const list = visible();
  openSheet(`
    <h2>ส่งออกไฟล์</h2>
    <p class="meta">ส่งออก ${list.length} รายการตามตัวกรองตอนนี้</p>
    <h3>ข้อมูลที่จะใส่ในไฟล์</h3>
    <label class="check"><input type="radio" name="scope" value="owner" checked> ทั้งหมด รวมข้อมูลเจ้าของ (เก็บไว้เอง)</label>
    <label class="check"><input type="radio" name="scope" value="public"> เฉพาะข้อมูลทรัพย์ + ข้อความโพส (ส่งให้คนอื่นได้)</label>
    <div class="actions">
      <button class="btn primary" type="button" id="xXlsx">Excel (.xlsx)</button>
      <button class="btn" type="button" id="xCsv">CSV</button>
      <button class="btn full" type="button" id="xCopy">คัดลอกเป็นตาราง (วางใน Google Sheets/Excel)</button>
    </div>
    <p class="err" id="xErr"></p>`);
  const own = ()=>document.querySelector('input[name="scope"]:checked').value==="owner";
  const name = ext=>`ทรัพย์${own()?"-รวมเจ้าของ":"-สำหรับลูกค้า"}-${today()}.${ext}`;
  $("xCsv").onclick = ()=>download(name("csv"), toCSV(tableRows(list,own())), "text/csv;charset=utf-8");
  $("xXlsx").onclick = async()=>{
    let X; try{ X = await loadXLSX(); }catch(e){ $("xErr").textContent = "โหลดตัวสร้าง Excel ไม่ได้ ใช้ CSV แทนได้"; return; }
    const rows = tableRows(list,own()), ws = X.utils.aoa_to_sheet(rows);
    ws["!cols"] = rows[0].map((h,i)=>({wch:Math.min(40,Math.max(10,...rows.map(r=>String(r[i]).split("\n")[0].length)))}));
    const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, "ทรัพย์");
    download(name("xlsx"), new Blob([X.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  };
  $("xCopy").onclick = async()=>{
    const tsv = tableRows(list,own()).map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");
    toast(await Util.copy(tsv) ? "คัดลอกแล้ว ไปวางในชีตได้เลย" : "คัดลอกไม่ได้");
  };
}

function toast(t){ const el=$("toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2000); }
$("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
$("q").addEventListener("input", e=>{ q=e.target.value.trim().toLowerCase(); render(); });
$("addBtn").onclick = ()=>openForm(null);
$("exportBtn").onclick = openExport;
